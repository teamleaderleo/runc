name: Repair Fieldwork readonlyfs fixture

on:
  push:
    branches:
      - fieldwork/readonlyfs-validator-candidate
    paths:
      - .github/workflows/fieldwork-repair-readonlyfs-fixture.yml

permissions:
  contents: write

jobs:
  repair-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fieldwork/readonlyfs-validator-candidate
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize bounded fixture repair
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("libcontainer/specconv/spec_linux_test.go")
          text = path.read_text()
          needle = "\tspec.Linux = nil\n\tspec.Hostname = \"\"\n"
          replacement = (
              "\tspec.Linux = nil\n"
              "\tspec.Hostname = \"\"\n"
              "\t// This test exercises conversion without a Linux section. The example\n"
              "\t// spec defaults to a read-only root, which requires a configured mount\n"
              "\t// namespace and is unrelated to the boundary under test here.\n"
              "\tspec.Root.Readonly = false\n"
          )
          if replacement not in text:
              if text.count(needle) != 1:
                  raise SystemExit("fixture insertion point changed")
              path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff --check
          grep -A8 -B2 -F 'func TestSpecconvNoLinuxSection' libcontainer/specconv/spec_linux_test.go

      - name: Commit only the source fixture
        shell: bash
        run: |
          set -euxo pipefail
          if git diff --quiet -- libcontainer/specconv/spec_linux_test.go; then
            echo "Fixture already repaired."
            exit 0
          fi
          git config user.name "linux-fieldwork-bot"
          git config user.email "linux-fieldwork@example.invalid"
          git add libcontainer/specconv/spec_linux_test.go
          test "$(git diff --cached --name-only)" = "libcontainer/specconv/spec_linux_test.go"
          git commit -m "test: make no-Linux-section root mode explicit"
          git push origin HEAD:fieldwork/readonlyfs-validator-candidate
