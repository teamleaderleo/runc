name: Fieldwork validator characterization

on:
  pull_request:
    paths:
      - "libcontainer/configs/validate/**"
      - ".github/workflows/fieldwork-validator-characterization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-characterization:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact proposed head
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run focused mount-namespace characterization
        run: >-
          go test ./libcontainer/configs/validate
          -run TestValidateMountNamespaceRestrictionCoverage
          -count=1

      - name: Check changed Go formatting
        run: |
          test -z "$(gofmt -l libcontainer/configs/validate/mountns_restrictions_test.go)"

      - name: Check diff hygiene
        run: git diff --check
